<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Reviews | BUSINESS_NAME</title>
    <meta name="description" content="Read customer reviews and service feedback from people who chose our AC business." />
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/data/business.js"></script>
    <script src="/data/reviews.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container navbar">
        <a href="/" class="brand"><span class="brand-mark">AC</span><span data-business-name>Dhuruvan Air Conditioner Service Center</span></a>
        <nav>
          <ul class="nav-menu">
            <li><a href="/about">About</a></li>
            <li><a href="/products">Products</a></li>
            <li><a href="/services">Services</a></li>
            <li><a href="/offers">Offers</a></li>
            <li><a href="/brands">Brands</a></li>
            <li><a href="/contact">Contact</a></li>
          </ul>
        </nav>
        <div class="header-actions">
          <a class="button secondary" data-phone href="tel:7373329885">Call Now</a>
          <a class="button primary" href="/quote">Get a Quote</a>
        </div>
      </div>
    </header>

    <main>
      <section class="page-hero">
        <div class="container">
          <span class="eyebrow">Reviews</span>
          <h1>What customers say about our service</h1>
        </div>
      </section>

      <section class="page-content">
        <div class="container">
          <div class="review-grid" id="reviews-grid"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer-bottom">
        <span>© <span data-business-name>Dhuruvan Air Conditioner Service Center</span></span>
        <span>Trust built through service</span>
      </div>
    </footer>

    <script>
      const reviews = window.AC_REVIEWS || [];
      const grid = document.getElementById('reviews-grid');
      if (grid) {
        grid.innerHTML = reviews.map((review) => `
          <article class="review-card">
            <div class="review-stars">${'★'.repeat(review.rating)}${'☆'.repeat(5 - review.rating)}</div>
            <p>“${review.text}”</p>
            <div class="review-person">
              <strong>${review.name}</strong>
              <span>${review.location}</span>
            </div>
          </article>
        `).join('');
      }
    </script>
  </body>
</html>
