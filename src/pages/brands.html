<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brands | BUSINESS_NAME</title>
    <meta name="description" content="Explore leading AC brands such as Voltas, Carrier, Hitachi, Blue Star, and Mitsubishi Heavy Duty." />
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/data/business.js"></script>
    <script src="/data/brands.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container navbar">
        <a href="/" class="brand"><span class="brand-mark">AC</span><span data-business-name>Dhuruvan Air Conditioner Service Center</span></a>
        <nav>
          <ul class="nav-menu">
            <li><a href="/about">About</a></li>
            <li><a href="/products">Products</a></li>
            <li><a href="/services">Services</a></li>
            <li><a href="/offers">Offers</a></li>
            <li><a href="/brands">Brands</a></li>
            <li><a href="/contact">Contact</a></li>
          </ul>
        </nav>
        <div class="header-actions">
          <a class="button secondary" data-phone href="tel:7373329885">Call Now</a>
          <a class="button primary" href="/quote">Get a Quote</a>
        </div>
      </div>
    </header>

    <main>
      <section class="page-hero">
        <div class="container">
          <span class="eyebrow">Brands</span>
          <h1>Popular cooling brands we support</h1>
        </div>
      </section>

      <section class="page-content">
        <div class="container">
          <div class="brand-grid" id="brands-grid"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer-bottom">
        <span>© <span data-business-name>Dhuruvan Air Conditioner Service Center</span></span>
        <span>Brand options for every requirement</span>
      </div>
    </footer>

    <script>
      const brands = window.AC_BRANDS || [];
      const grid = document.getElementById('brands-grid');
      if (grid) {
        grid.innerHTML = brands.map((brand) => `
          <article class="brand-card">
            <div class="brand-page-image" style="${brand.image ? '' : `background: linear-gradient(135deg, ${brand.accent || '#0d6efd'}, rgba(15, 23, 42, 0.9));`}">
              ${brand.image
                ? `<img src="${brand.image}" alt="${brand.name} AC brand" loading="lazy" />`
                : `<span>${brand.name.slice(0, 2).toUpperCase()}</span>`}
            </div>
            <div class="brand-page-info">
              <h3>${brand.name}</h3>
              <p>${brand.description}</p>
            </div>
          </article>
        `).join('');
      }
    </script>
  </body>
</html>
