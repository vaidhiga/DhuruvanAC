<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking Admin | Dhuruvan Air Conditioner Service Center</title>
    <meta name="description" content="Manage booking enquiries and update service status." />
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
      body {
        background: #f8fafc;
      }
      .admin-shell {
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 20px 60px;
      }
      .admin-card {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.03);
      }
      .admin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
      }
      .admin-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .summary-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 22px;
      }
      .summary-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        padding: 18px;
      }
      .summary-card strong {
        display: block;
        font-size: 1.6rem;
        color: #0f172a;
        margin-top: 8px;
      }
      .summary-card span {
        color: #475569;
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-weight: 700;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        border-bottom: 1px solid #e2e8f0;
        padding: 14px 12px;
        text-align: left;
        vertical-align: top;
      }
      th {
        background: #f1f5f9;
        color: #0f172a;
      }
      .status-badge {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        background: #dbeafe;
        color: #1d4ed8;
      }
      .status-badge.confirmed { background: #dcfce7; color: #166534; }
      .status-badge.scheduled { background: #fef3c7; color: #92400e; }
      .status-badge.completed { background: #dcfce7; color: #166534; }
      .status-badge.cancelled { background: #fee2e2; color: #991b1b; }
      select {
        width: 100%;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        padding: 10px 12px;
      }
      .status-form {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      @media (max-width: 768px) {
        .admin-header {
          flex-direction: column;
          align-items: flex-start;
        }
        table {
          display: block;
          overflow-x: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="admin-shell">
      <div class="admin-header">
        <div>
          <span class="eyebrow">Admin panel</span>
          <h1>Booking Status Dashboard</h1>
        </div>
        <div class="admin-actions">
          <button class="button secondary" id="download-csv-btn" type="button">Download CSV</button>
          <button class="button primary" id="email-report-btn" type="button">Email Report</button>
          <a class="button ghost" href="/">Back to website</a>
        </div>
      </div>

      <div id="summary-grid" class="summary-grid"></div>

      <div class="admin-card">
        <div id="booking-table-wrapper">Loading bookings...</div>
      </div>
    </div>

    <script>
      const statusOrder = ['new', 'confirmed', 'scheduled', 'completed', 'cancelled'];

      function escapeCsv(value) {
        const text = String(value ?? '');
        return '"' + text.replace(/"/g, '""') + '"';
      }

      function formatReportText(bookings) {
        if (!bookings.length) {
          return 'No booking data available.';
        }

        const summary = statusOrder.map((status) => {
          const count = bookings.filter((booking) => (booking.status || 'new') === status).length;
          return `${status.toUpperCase()}: ${count}`;
        }).join('\n');

        const lines = bookings.map((booking) => {
          const type = booking.type === 'quote' ? 'Purchase enquiry' : 'Service booking';
          return [
            `#${booking.id}`,
            `${booking.customerName} (${booking.phoneNumber})`,
            `Type: ${type}`,
            `Location: ${booking.location || '-'}`,
            `Status: ${booking.status || 'new'}`,
            `Created: ${booking.createdAt || '-'}`,
            `Details: ${booking.type === 'quote'
              ? `Brand=${booking.preferredBrand || '-'}; Type=${booking.acType || '-'}; Capacity=${booking.capacity || '-'}; Budget=${booking.budget || '-'}`
              : `Brand=${booking.acBrand || '-'}; Service=${booking.serviceRequired || '-'}; Problem=${booking.acProblem || '-'}`}`
          ].join('\n');
        });

        return `AC Booking Report\n\nSummary:\n${summary}\n\nBookings:\n${lines.join('\n\n')}`;
      }

      function renderSummary(bookings) {
        const summaryGrid = document.getElementById('summary-grid');
        const counts = {
          total: bookings.length,
          new: bookings.filter((booking) => (booking.status || 'new') === 'new').length,
          confirmed: bookings.filter((booking) => (booking.status || 'new') === 'confirmed').length,
          completed: bookings.filter((booking) => (booking.status || 'new') === 'completed').length
        };

        summaryGrid.innerHTML = `
          <div class="summary-card"><span>Total</span><strong>${counts.total}</strong></div>
          <div class="summary-card"><span>New</span><strong>${counts.new}</strong></div>
          <div class="summary-card"><span>Confirmed</span><strong>${counts.confirmed}</strong></div>
          <div class="summary-card"><span>Completed</span><strong>${counts.completed}</strong></div>
        `;
      }

      function downloadCsv(bookings) {
        const header = [
          'ID', 'Type', 'Customer Name', 'Phone Number', 'Location', 'Status',
          'Preferred Brand', 'AC Type', 'Capacity', 'Budget', 'Requirement',
          'AC Brand', 'Service Required', 'AC Problem', 'Preferred Date',
          'Preferred Time', 'Additional Message', 'Created At'
        ];

        const rows = bookings.map((booking) => [
          booking.id,
          booking.type,
          booking.customerName,
          booking.phoneNumber,
          booking.location,
          booking.status || 'new',
          booking.preferredBrand || '',
          booking.acType || '',
          booking.capacity || '',
          booking.budget || '',
          booking.requirement || '',
          booking.acBrand || '',
          booking.serviceRequired || '',
          booking.acProblem || '',
          booking.preferredDate || '',
          booking.preferredTime || '',
          booking.additionalMessage || '',
          booking.createdAt || ''
        ].map(escapeCsv).join(','));

        const csv = [header.map(escapeCsv).join(','), ...rows].join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'ac-booking-report.csv';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }

      function sendEmailReport(bookings) {
        const config = window.getBusinessInfo ? window.getBusinessInfo() : {};
        const ownerEmail = config.email || 'hello@example.com';
        const subject = encodeURIComponent('AC Booking Report');
        const body = encodeURIComponent(formatReportText(bookings));
        window.location.href = `mailto:${ownerEmail}?subject=${subject}&body=${body}`;
      }

      async function fetchBookings() {
        const response = await fetch('/api/bookings');
        const result = await response.json();
        if (!result.success) {
          document.getElementById('booking-table-wrapper').innerHTML = '<p>Unable to load bookings.</p>';
          return;
        }

        const bookings = result.bookings || [];
        renderSummary(bookings);

        if (!bookings.length) {
          document.getElementById('booking-table-wrapper').innerHTML = '<p>No bookings yet.</p>';
          document.getElementById('download-csv-btn').disabled = true;
          document.getElementById('email-report-btn').disabled = true;
          return;
        }

        document.getElementById('download-csv-btn').disabled = false;
        document.getElementById('email-report-btn').disabled = false;

        const rows = bookings.map((booking) => {
          const label = booking.type === 'quote' ? 'Purchase enquiry' : 'Service booking';
          const details = booking.type === 'quote'
            ? `Brand: ${booking.preferredBrand || '-'}<br>Type: ${booking.acType || '-'}<br>Capacity: ${booking.capacity || '-'}<br>Budget: ${booking.budget || '-'}`
            : `Brand: ${booking.acBrand || '-'}<br>Service: ${booking.serviceRequired || '-'}<br>Problem: ${booking.acProblem || '-'}<br>Date: ${booking.preferredDate || '-'} ${booking.preferredTime || '-'}`;

          return `
            <tr>
              <td>#${booking.id}</td>
              <td>${booking.customerName}<br><small>${booking.phoneNumber}</small></td>
              <td>${label}<br><small>${booking.location}</small></td>
              <td>${details}</td>
              <td>
                <span class="status-badge ${booking.status || 'new'}">${booking.status || 'new'}</span>
              </td>
              <td>
                <form class="status-form" data-id="${booking.id}">
                  <select name="status">
                    <option value="new" ${booking.status === 'new' ? 'selected' : ''}>New</option>
                    <option value="confirmed" ${booking.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                    <option value="scheduled" ${booking.status === 'scheduled' ? 'selected' : ''}>Scheduled</option>
                    <option value="completed" ${booking.status === 'completed' ? 'selected' : ''}>Completed</option>
                    <option value="cancelled" ${booking.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                  </select>
                  <button class="button secondary" type="submit">Update</button>
                </form>
              </td>
            </tr>
          `;
        }).join('');

        document.getElementById('booking-table-wrapper').innerHTML = `
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Customer</th>
                <th>Type / Location</th>
                <th>Details</th>
                <th>Status</th>
                <th>Update</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `;

        document.querySelectorAll('.status-form').forEach((form) => {
          form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const id = form.dataset.id;
            const status = form.querySelector('select').value;

            const response = await fetch(`/api/bookings/${id}/status`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ status })
            });

            const result = await response.json();
            if (result.success) {
              fetchBookings();
            } else {
              alert(result.message || 'Unable to update status.');
            }
          });
        });
      }

      document.getElementById('download-csv-btn').addEventListener('click', async () => {
        const response = await fetch('/api/bookings');
        const result = await response.json();
        if (result.success) {
          downloadCsv(result.bookings || []);
        }
      });

      document.getElementById('email-report-btn').addEventListener('click', async () => {
        const response = await fetch('/api/bookings');
        const result = await response.json();
        if (result.success) {
          sendEmailReport(result.bookings || []);
        }
      });

      fetchBookings();
    </script>
  </body>
</html>
